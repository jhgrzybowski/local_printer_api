openapi: 3.1.0
info:
  title: Local Printer API
  version: 0.2.0
  description: >
    REST API for managing uploads, previews, print submission, printer status,
    printer options, and CUPS jobs through a local CUPS queue.

servers:
  - url: http://192.168.100.99:8000
    description: Backend IP on LAN
  - url: http://ubuntu26-remote.local:8000
    description: Example LAN server hostname
  - url: http://drukarka.local:8000
    description: Alternative LAN server hostname

tags:
  - name: Health
  - name: Auth
  - name: Printer
  - name: Files
  - name: Print
  - name: Jobs
  - name: Preferences
  - name: History

paths:
  /health:
    get:
      tags: [Health]
      summary: Backend health check
      operationId: getHealth
      responses:
        "200":
          description: Backend is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/signup:
    post:
      tags: [Auth]
      summary: Create a local user account and session
      description: |
        Creates a LAN-local account, starts a session, and sets the
        `local_printer_session` HttpOnly cookie used by protected endpoints.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Account created and session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Start a session for an existing user
      description: |
        Validates credentials, starts a session, and sets the
        `local_printer_session` HttpOnly cookie used by protected endpoints.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session if one exists
      operationId: logout
      responses:
        "200":
          description: Session cookie cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      security:
        - SessionCookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

  /status:
    get:
      tags: [Printer]
      summary: Get normalized printer/CUPS queue status
      operationId: getStatus
      responses:
        "200":
          description: Current printer queue status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterStatus"

  /options:
    get:
      tags: [Printer]
      summary: Get detected printer capabilities
      description: >
        Everything a print dialog needs: the main settings with the driver's own
        labels and paper geometry, the queue's defaults, and every remaining
        driver option under advanced. Capabilities are cached for 30 seconds and
        revalidated against the queue's PPD, so repeated calls are cheap. The
        response is gzip-compressed when the client accepts it.
      operationId: getOptions
      parameters:
        - name: debug
          in: query
          required: false
          description: Include raw detected CUPS/PPD options when true.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Frontend-friendly detected printer options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterOptionsResponse"
        "503":
          description: CUPS unavailable or queue missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /capabilities:
    get:
      tags:
      - Files
      summary: Discover file types and conversion limits
      operationId: getCapabilities
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
  /files/{file_id}:
    get:
      tags:
      - Files
      summary: Retrieve metadata for an owned upload
      operationId: getFile
      security: &id001
      - SessionCookieAuth: []
      parameters:
      - &id002
        name: file_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File missing or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /files/{file_id}/pdf:
    get:
      tags:
      - Files
      summary: Download the PDF used by preview and printing
      operationId: getFilePdf
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Stored printable PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Upload has no PDF representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File missing or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /print/validate:
    post:
      tags:
      - Print
      summary: Validate a print request without submitting it
      description: Uses the same page selection and option mapper as /print, without spooling a print file, so a
        print dialog can call it on every settings change. valid means all requested options are supported and
        no driver constraint conflicts. layout plans how the selected pages land on sheets. ready_for_print is a
        live queue snapshot; a printer that is switched off is detected within seconds without delaying the reply.
        /print rechecks readiness and options; validation does not reserve the queue.
      operationId: validatePrint
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintValidationResponse'
        '400':
          description: Invalid page range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File missing or not owned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: CUPS unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /files:
    post:
      tags:
      - Files
      summary: Upload a file for previewing or printing
      operationId: uploadFile
      security:
      - SessionCookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File accepted and stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '400':
          description: Invalid or corrupt file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Uploaded file or converted output exceeds its size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Document conversion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Office converter unavailable or busy; retry upload later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Office conversion timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Office files are validated and converted synchronously before success. The returned page count,
        PDF, previews, and print source refer to one stored PDF. See /capabilities for runtime availability. Native
        PDF/image/text uploads remain supported.

  /files/{file_id}/preview:
    get:
      tags: [Files]
      summary: Get preview metadata for an uploaded file
      operationId: getFilePreview
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Preview metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: Unknown file ID or file owned by another user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /files/{file_id}/preview/{page}:
    get:
      tags: [Files]
      summary: Get one preview page as PNG
      operationId: getPreviewPage
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: page
          in: path
          required: true
          description: 1-based preview page number.
          schema:
            type: integer
            minimum: 1
        - name: size
          in: query
          required: false
          description: >
            full renders at PREVIEW_DPI with the long side capped at 1600 px.
            thumb scales the long side to 320 px for page strips.
          schema:
            type: string
            enum: [full, thumb]
            default: full
      responses:
        "200":
          description: >
            Preview image. Rendered pages never change, so the response carries
            Cache-Control private, max-age=604800, immutable.
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, max-age=604800, immutable
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "400":
          description: Invalid page number or preview size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown file ID, file owned by another user, or preview page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: PDF preview exceeded its rendering time limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /print:
    post:
      tags:
      - Print
      summary: Submit an uploaded file to CUPS
      operationId: submitPrintJob
      security:
      - SessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintRequest'
      responses:
        '200':
          description: Print job submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '400':
          description: Invalid print request or invalid page range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Unknown file ID or file owned by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Printer or queue state prevents printing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: CUPS unavailable or printer queue unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request, unsupported print options, or options that the driver's constraints forbid together
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: Unsupported options and driver constraint conflicts are rejected before submission by default.
        Set strict_options=false only to opt into warning-and-drop behavior. Unspecified options inherit CUPS
        defaults. PDF pages are selected (pages, then page_set) and custom-scaled before CUPS receives them; plain
        text page selection is passed to CUPS as page-ranges and page-set and must be ascending. After an ambiguous
        network failure, inspect history before retrying; requests are not idempotent.

  /jobs:
    get:
      tags: [Jobs]
      summary: List current user's CUPS jobs for the configured queue
      description: |
        Lists jobs from CUPS that match the current user's persisted or
        transient print submissions. The default `active` scope returns only
        not-completed jobs so frontend queue/task views do not show historical
        completed jobs as cancelable work. Jobs submitted by other users are
        filtered out before job metadata is returned.
      operationId: listJobs
      security:
        - SessionCookieAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          description: Which CUPS job set to return. Defaults to active.
          schema:
            type: string
            enum: [active, completed, all]
            default: active
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "400":
          description: Invalid job scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: CUPS unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Get one current-user CUPS job
      description: |
        Returns CUPS job details only when the job matches the current user's
        persisted or transient print submissions.
      operationId: getJob
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobInfo"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: Job not found or not submitted by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: CUPS unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Jobs]
      summary: Cancel an active CUPS job where possible
      description: |
        Cancels active jobs only. Historical terminal jobs are not retried as
        failed cancellations; they return a domain response explaining that the
        job is already terminal and can only be forgotten/purged if supported.
      operationId: cancelJob
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled, missing, or already terminal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelJobResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: CUPS job was not submitted by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: CUPS unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{job_id}/forget:
    post:
      tags: [Jobs]
      summary: Purge one historical CUPS job record where supported
      description: |
        Attempts to remove a terminal historical job record from CUPS using
        pycups `cancelJob(jobid, purge_job=True)`. Active jobs must be cancelled
        first. This endpoint does not perform bulk purges.
      operationId: forgetJob
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Historical job record purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgetJobResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: CUPS job was not submitted by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CUPS did not allow the purge, or the job is still active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: CUPS unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /me/preferences:
    get:
      tags: [Preferences]
      summary: Get saved preferences for the current user
      operationId: getPreferences
      security:
        - SessionCookieAuth: []
      responses:
        "200":
          description: Current user preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

    put:
      tags: [Preferences]
      summary: Replace saved preferences for the current user
      operationId: putPreferences
      security:
        - SessionCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved user preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

  /history:
    get:
      tags: [History]
      summary: List print history for the current user
      description: >-
        Refreshes nonterminal history from matching CUPS jobs and recovers saved
        purge markers. If CUPS is unavailable or a job disappears without a marker,
        returns its last known status. Results are newest first and paginated;
        old entries may expire under HISTORY_TTL_DAYS.
      operationId: listHistory
      security:
        - SessionCookieAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum entries to return.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of newest entries to skip.
      responses:
        "200":
          description: Print history list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryListResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"

  /history/{history_id}:
    get:
      tags: [History]
      summary: Get one print history entry for the current user
      description: >-
        Refreshes nonterminal history from matching CUPS jobs and recovers saved
        purge markers. If CUPS is unavailable or a job disappears without a marker,
        returns its last known status.
      operationId: getHistoryEntry
      security:
        - SessionCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/HistoryId"
      responses:
        "200":
          description: Print history entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintHistoryEntry"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          description: History entry not found for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: local_printer_session
      description: HttpOnly session cookie set by signup/login.

  responses:
    AuthenticationRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  parameters:
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
      description: Internal uploaded file identifier.

    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: integer
      description: CUPS job ID.

    HistoryId:
      name: history_id
      in: path
      required: true
      schema:
        type: integer
      description: Per-user print history record ID.

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: canon-printer-manager

    SignupRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: >
            Desired username. Usernames are normalized to lowercase and must be
            3-40 characters using letters, numbers, dot, underscore, or hyphen.
          example: alice
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type:
            - string
            - "null"
          maxLength: 80
          example: Alice

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username is normalized to lowercase before lookup.
          example: alice
        password:
          type: string
          format: password

    User:
      type: object
      required: [id, username, created_at, updated_at]
      properties:
        id:
          type: integer
        username:
          type: string
          example: alice
        display_name:
          type:
            - string
            - "null"
          example: Alice
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        session:
          $ref: "#/components/schemas/AuthSession"

    LogoutResponse:
      type: object
      required: [logged_out]
      properties:
        logged_out:
          type: boolean
          example: true

    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    CupsStatus:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        error:
          type:
            - string
            - "null"

    PrinterNetworkStatus:
      type: object
      required: [checked, reachable]
      properties:
        checked:
          type: boolean
          description: Whether the backend attempted a direct printer network probe.
        host:
          type:
            - string
            - "null"
          example: 192.168.100.100
        port:
          type:
            - integer
            - "null"
          example: 515
        reachable:
          type:
            - boolean
            - "null"
          description: Whether the configured printer endpoint accepted a TCP connection.
        error:
          type:
            - string
            - "null"

    PrinterStatus:
      type: object
      required:
        - queue_name
        - exists
        - state
        - enabled
        - ready_for_print
        - reasons
        - cups
      properties:
        queue_name:
          type: string
          example: Canon_MG5350
        exists:
          type: boolean
        state:
          type: string
          examples: [idle, processing, stopped, missing, offline]
        state_code:
          type:
            - integer
            - "null"
          description: Raw CUPS printer-state code when available.
        accepting_jobs:
          type:
            - boolean
            - "null"
          description: Raw CUPS printer-is-accepting-jobs value; may remain true when the printer is offline.
        enabled:
          type:
            - boolean
            - "null"
          description: Whether the CUPS printer-state is not stopped; does not imply printer reachability.
        ready_for_print:
          type: boolean
          description: Whether this API currently allows print submission based on CUPS state, queue acceptance, and the network probe. Recheck at submission time because status can change.
        message:
          type: string
        device_uri:
          type:
            - string
            - "null"
          example: lpd://192.168.100.100/PASSTHRU
        location:
          type:
            - string
            - "null"
        reasons:
          type: array
          items:
            type: string
        cups:
          $ref: "#/components/schemas/CupsStatus"
        network:
          $ref: "#/components/schemas/PrinterNetworkStatus"

    OptionBlock:
      type: object
      required: [api_name, raw_option, supported, choices]
      properties:
        api_name:
          type: string
        raw_option:
          type:
            - string
            - "null"
        supported:
          type: boolean
        choices:
          description: Raw CUPS choices when raw_option is set; API choices when mapped choices use different CUPS options.
          type: array
          items:
            type: string
        mapping:
          type: object
          additionalProperties:
            type: string
        option_mapping:
          description: CUPS option name selected for each API choice when choices use different backends.
          type: object
          additionalProperties:
            type: string
        recommended_mapping:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
        raw_options:
          type: array
          items:
            type: string
        notes:
          type: string
        labels:
          description: Driver labels for raw choices, e.g. w288h432 -> 4x6 or Rear -> Rear tray.
          type: object
          additionalProperties:
            type: string
        default:
          description: The queue's default raw choice.
          type:
            - string
            - "null"
        details:
          description: paper_sizes only. Sheet size and unprintable margins for each choice.
          type: array
          items:
            $ref: "#/components/schemas/PaperSizeDetail"

    PrinterOptionsResponse:
      type: object
      required:
        - queue
        - paper_sizes
        - duplex_modes
        - color_modes
        - quality
        - media_types
        - collate
        - fit_to_page
        - orientation
      properties:
        queue:
          type: string
          example: Canon_MG5350
        paper_sizes:
          $ref: "#/components/schemas/OptionBlock"
        duplex_modes:
          $ref: "#/components/schemas/OptionBlock"
        color_modes:
          $ref: "#/components/schemas/OptionBlock"
        quality:
          $ref: "#/components/schemas/OptionBlock"
        media_types:
          $ref: "#/components/schemas/OptionBlock"
        collate:
          $ref: "#/components/schemas/OptionBlock"
        fit_to_page:
          $ref: "#/components/schemas/OptionBlock"
        orientation:
          $ref: "#/components/schemas/OptionBlock"
        copies:
          type: object
          properties:
            supported:
              type: boolean
            min:
              type: integer
            max:
              type: integer
        page_set:
          $ref: "#/components/schemas/OptionBlock"
        pages_per_sheet:
          type: object
          properties:
            api_name:
              type: string
            raw_option:
              type:
                - string
                - "null"
            supported:
              type: boolean
            choices:
              type: array
              items:
                type: integer
            layouts:
              type: array
              items:
                type: string
            default_layout:
              type:
                - string
                - "null"
            borders:
              type: array
              items:
                type: string
        scaling:
          type: object
          properties:
            api_name:
              type: string
            raw_option:
              type:
                - string
                - "null"
            supported:
              type: boolean
            choices:
              type: array
              items:
                type: string
            custom_percent:
              type: object
              properties:
                api_name:
                  type: string
                supported:
                  type: boolean
                min:
                  type: integer
                max:
                  type: integer
                documents:
                  type: array
                  items:
                    type: string
        reverse_order:
          $ref: "#/components/schemas/OptionBlock"
        media_sources:
          $ref: "#/components/schemas/OptionBlock"
        borderless:
          $ref: "#/components/schemas/OptionBlock"
        defaults:
          $ref: "#/components/schemas/PrintDefaults"
        advanced:
          description: >
            Driver options without a dedicated setting, like a print dialog's
            advanced tab. Send choices back in PrintOptions.advanced.
          type: array
          items:
            $ref: "#/components/schemas/AdvancedOption"
        driver:
          type:
            - string
            - "null"
          example: Canon PIXMA MG5350 - CUPS+Gutenprint v5.3.4
        debug:
          type: object
          additionalProperties: true
          description: Present only when debug=true.

    FileUploadResponse:
      type: object
      required:
      - file_id
      - original_filename
      - detected_mime
      - size_bytes
      - preview_available
      - converted
      - printable_mime
      - printable_sha256
      - pdf_url
      - warnings
      properties:
        file_id:
          type: string
          example: uploaded-file-id
        original_filename:
          type: string
          example: test.pdf
        detected_mime:
          type: string
          example: application/pdf
        size_bytes:
          type: integer
          minimum: 0
        page_count:
          type:
          - integer
          - 'null'
          minimum: 1
        preview_available:
          type: boolean
        converted:
          type: boolean
          description: >
            True when Office input, or plain text laid out with an embedded
            Unicode font, was converted once to PDF. Converted files have a
            preview and accept any page order.
        printable_mime:
          type: string
        printable_sha256:
          type:
          - string
          - 'null'
          description: SHA-256 of stored printable bytes; null for legacy uploads
        pdf_url:
          type:
          - string
          - 'null'
          description: Authenticated URL for the stored PDF, or null
        warnings:
          type: array
          items:
            type: string

    PreviewPage:
      type: object
      required: [page, url]
      properties:
        page:
          type: integer
          minimum: 1
        url:
          type: string
          example: /files/uploaded-file-id/preview/1
        thumb_url:
          type: string
          example: /files/uploaded-file-id/preview/1?size=thumb
        size_bytes:
          type: integer
          minimum: 0
          description: Present after the full preview page has been rendered
        width_pt:
          type: number
          description: Displayed page width in points (after the page's own rotation).
        height_pt:
          type: number
          description: Displayed page height in points. Images use their resolution, or 128 ppi without one.

    PreviewResponse:
      type: object
      required: [file_id, page_count, pages]
      properties:
        file_id:
          type: string
        page_count:
          type:
            - integer
            - "null"
          minimum: 1
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PreviewPage"

    PrintOptions:
      type: object
      additionalProperties: true
      properties:
        copies:
          type: integer
          minimum: 1
          maximum: 99
          default: 1
        pages:
          type:
            - string
            - "null"
          description: Page range string, e.g. "1", "1,3-5,8".
        paper_size:
          type:
            - string
            - "null"
          example: A4
        orientation:
          type:
            - string
            - "null"
          enum: [portrait, landscape, reverse-landscape, reverse-portrait, null]
        color_mode:
          type:
            - string
            - "null"
          enum: [monochrome, color, auto, null]
        duplex:
          type:
            - string
            - "null"
          enum: [none, long-edge, short-edge, null]
        quality:
          type:
            - string
            - "null"
          enum: [draft, normal, high, null]
        collate:
          type:
            - boolean
            - "null"
        media_type:
          type:
            - string
            - "null"
          example: plain
        fit_to_page:
          type:
            - boolean
            - "null"
          description: Scale pages to the printable area. Ignored when scaling is set.
        page_set:
          type:
            - string
            - "null"
          enum: [all, odd, even, null]
          description: Odd or even document page numbers, applied after pages.
        pages_per_sheet:
          type:
            - integer
            - "null"
          enum: [1, 2, 4, 6, 9, 16, null]
        pages_per_sheet_layout:
          type:
            - string
            - "null"
          enum: [lrtb, lrbt, rltb, rlbt, tblr, tbrl, btlr, btrl, null]
          description: Order of pages on a sheet, e.g. lrtb is left to right, then top to bottom.
        page_border:
          type:
            - string
            - "null"
          enum: [none, single, single-thick, double, double-thick, null]
        scaling:
          type:
            - string
            - "null"
          enum: [auto, auto-fit, fit, fill, none, null]
          description: >
            auto keeps pages that fit and shrinks larger ones; fit scales to the
            printable area; fill covers the sheet and crops; none prints at actual size.
        scale_percent:
          type:
            - integer
            - "null"
          minimum: 10
          maximum: 400
          description: >
            Custom scale of PDF page content, centred on the page. Requires
            pages_per_sheet=1 and cannot be combined with fit_to_page or a scaling
            other than none.
        reverse_order:
          type:
            - boolean
            - "null"
          description: Deliver sheets last to first (duplex pairs stay together).
        media_source:
          type:
            - string
            - "null"
          example: Rear
          description: Input tray, as a media_sources choice or auto.
        borderless:
          type:
            - boolean
            - "null"
        advanced:
          type:
            - object
            - "null"
          additionalProperties:
            type: string
          example:
            StpImageType: Photo
          description: >
            Driver options from the advanced list of /options, keyword to choice.
            Values must match a listed choice. A main setting that sets the same
            option wins.

    PrintRequest:
      type: object
      required:
      - file_id
      properties:
        file_id:
          type: string
        options:
          $ref: '#/components/schemas/PrintOptions'
        strict_options:
          type: boolean
          default: true
          description: Reject unsupported options instead of dropping them
      additionalProperties: false

    PrintResponse:
      type: object
      required:
        - job_id
        - history_id
        - queue
        - submitted_filename
        - applied_options
        - unsupported_options
        - warnings
      properties:
        job_id:
          type: integer
        history_id:
          type:
            - integer
            - "null"
          description: >
            Per-user print history record created for this submission. Null
            means CUPS accepted the job but the history write failed.
        queue:
          type: string
          example: Canon_MG5350
        submitted_filename:
          type: string
        applied_options:
          type: object
          additionalProperties:
            type: string
        unsupported_options:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    JobInfo:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: integer
        name:
          type: string
        state:
          type: string
        state_code:
          type:
            - integer
            - "null"
        reasons:
          type: array
          items:
            type: string
        user:
          type: string
        printer_uri:
          type:
            - string
            - "null"
        job_uuid:
          type:
            - string
            - "null"
        created_at:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        completed_at:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        is_active:
          type: boolean
          description: True for not-completed CUPS job states.
        is_terminal:
          type: boolean
          description: True for canceled, aborted, or completed jobs.
        can_cancel:
          type: boolean
          description: True when the API will attempt CUPS cancellation.
        can_forget:
          type: boolean
          description: True when the job is terminal history eligible for purge attempts.
        action_hint:
          type: string
          description: Frontend-safe explanation of allowed job actions.
        processing_at:
          oneOf:
            - type: integer
            - type: "null"
        pages_completed:
          type:
            - integer
            - "null"
          description: Impressions (printed sides) CUPS has finished.
        sheets_completed:
          type:
            - integer
            - "null"
        media_progress:
          type:
            - integer
            - "null"
          description: Percent of the current sheet CUPS has processed (CUPS extension).
        state_message:
          type: string
          description: Latest message from the printer driver or backend.

    JobsResponse:
      type: object
      required: [scope, queue, jobs]
      properties:
        scope:
          type: string
          enum: [active, completed, all]
        queue:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobInfo"
        counts:
          type: object
          description: Counts after filtering CUPS jobs to the current user.
          properties:
            active:
              type: integer
            completed:
              type: integer
            all:
              type: integer

    CancelJobResponse:
      type: object
      required: [job_id, cancelled]
      properties:
        job_id:
          type: integer
        cancelled:
          type: boolean
        already_terminal:
          type: boolean
          default: false
        can_forget:
          type: boolean
          default: false
        message:
          type: string

    ForgetJobResponse:
      type: object
      required: [job_id, forgotten, method]
      properties:
        job_id:
          type: integer
        forgotten:
          type: boolean
        method:
          type: string
          enum: [pycups-purge-job]
        reason:
          type: string

    Preferences:
      type: object
      additionalProperties: true
      description: >
        Arbitrary JSON object persisted for the current user. The frontend can
        store selected print defaults such as paper size, copies, color, duplex,
        media type, and fit-to-page.
      example:
        paper_size: A4
        copies: 2
        color_mode: color
        duplex: none

    PreferencesResponse:
      type: object
      required: [preferences]
      properties:
        preferences:
          $ref: "#/components/schemas/Preferences"

    PrintHistoryEntry:
      type: object
      required:
        - id
        - file_id
        - original_filename
        - detected_mime
        - size_bytes
        - requested_options
        - applied_options
        - cups_job_id
        - warnings
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        file_id:
          type: string
        original_filename:
          type: string
          example: test.pdf
        detected_mime:
          type: string
          example: application/pdf
        size_bytes:
          type: integer
          minimum: 0
        page_count:
          type:
            - integer
            - "null"
          minimum: 1
        requested_options:
          $ref: "#/components/schemas/PrintOptions"
        applied_options:
          type: object
          additionalProperties:
            type: string
        cups_job_id:
          type: integer
        warnings:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [submitted, pending, pending-held, processing, processing-stopped, cancel-requested, canceled, aborted, completed, forgotten]
          description: >-
            Last verified CUPS state, or submitted before verification. A successful
            cancel request sets cancel-requested until CUPS reports a terminal state.
            Successful purge sets forgotten, including recovery from a saved purge
            marker. If a job disappears from CUPS without a marker, the last known
            state is retained.
          example: submitted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Last time the saved status changed.

    HistoryListResponse:
      type: object
      required: [history, total, limit, offset]
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/PrintHistoryEntry"
        total:
          type: integer
          description: Total retained entries belonging to the current user.
        limit:
          type: integer
        offset:
          type: integer

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true

    CapabilitiesResponse:
      type: object
      required:
      - native_mime_types
      - office
      - max_upload_bytes
      - max_image_pixels
      - preview
      - strict_print_options_default
      - print_validation_url
      properties:
        text:
          type: object
          description: Whether plain text is laid out as a PDF (A4, 80 columns) and with which font.
          properties:
            rendered_to_pdf:
              type: boolean
            font:
              type:
              - string
              - 'null'
        native_mime_types:
          type: array
          items:
            type: string
        office:
          type: object
          required:
          - available
          - formats
          - timeout_seconds
          - cpu_time_soft_limit_seconds
          - cpu_time_hard_limit_seconds
          - max_pages
          - address_space_limit_mb
          - max_output_bytes
          - max_archive_members
          - max_archive_expanded_bytes
          - max_xml_part_bytes
          - spreadsheet_layout
          - max_concurrent_conversions
          properties:
            available:
              type: boolean
            formats:
              type: array
              items:
                type: object
                required:
                - extension
                - mime_type
                - available
                properties:
                  extension:
                    type: string
                  mime_type:
                    type: string
                  available:
                    type: boolean
            timeout_seconds:
              type: integer
            cpu_time_soft_limit_seconds:
              type: integer
            cpu_time_hard_limit_seconds:
              type: integer
            max_pages:
              type: integer
            address_space_limit_mb:
              type: integer
            max_output_bytes:
              type: integer
            max_archive_members:
              type: integer
            max_archive_expanded_bytes:
              type: integer
            max_xml_part_bytes:
              type: integer
            spreadsheet_layout:
              type: string
              const: saved-print-settings
            max_concurrent_conversions:
              type: integer
              const: 1
        max_upload_bytes:
          type: integer
        max_image_pixels:
          type: integer
        preview:
          type: object
          required:
          - pdf_timeout_seconds
          - max_dimension
          - dpi
          properties:
            pdf_timeout_seconds:
              type: integer
            max_dimension:
              type: integer
            dpi:
              type: integer
            thumb_dimension:
              type: integer
              description: Long side of ?size=thumb preview pages, in pixels.
            sizes:
              type: array
              items:
                type: string
            concurrency:
              type: integer
              description: Preview pages rendered at once.
        strict_print_options_default:
          type: boolean
        print_validation_url:
          type: string
    PrintValidationResponse:
      type: object
      required:
      - file_id
      - ready_for_print
      - valid
      - page_count
      - selected_pages
      - applied_options
      - unsupported_options
      - warnings
      - printable_sha256
      properties:
        file_id:
          type: string
        ready_for_print:
          type: boolean
        valid:
          type: boolean
        page_count:
          type:
          - integer
          - 'null'
        selected_pages:
          type:
          - array
          - 'null'
          items:
            type: integer
        applied_options:
          type: object
          additionalProperties:
            type: string
        unsupported_options:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        printable_sha256:
          type:
          - string
          - 'null'
        conflicts:
          type: array
          items:
            type: string
          description: Driver (PPD) constraints the selected options violate. /print rejects them in strict mode.
        layout:
          description: How the selected pages land on sheets; null for plain text that CUPS lays out because no font was available.
          oneOf:
          - $ref: '#/components/schemas/LayoutPlan'
          - type: 'null'

    PaperSizeDetail:
      type: object
      properties:
        value:
          type: string
          example: w288h432
        label:
          type: string
          example: 4x6
        width_pt:
          type: number
        height_pt:
          type: number
        margins_pt:
          description: Unprintable margins in portrait orientation; null when the driver does not say.
          oneOf:
          - type: object
            properties:
              left:
                type: number
              bottom:
                type: number
              right:
                type: number
              top:
                type: number
          - type: 'null'

    PrintDefaults:
      description: The queue's defaults in API values, to initialise a dialog. Null when unknown.
      type: object
      properties:
        paper_size:
          type:
          - string
          - 'null'
        duplex:
          type:
          - string
          - 'null'
        color_mode:
          type:
          - string
          - 'null'
        quality:
          type:
          - string
          - 'null'
        media_type:
          type:
          - string
          - 'null'
        media_source:
          type:
          - string
          - 'null'
        copies:
          type: integer
        pages_per_sheet:
          type: integer
        scaling:
          type:
          - string
          - 'null'

    AdvancedOption:
      type: object
      properties:
        keyword:
          type: string
          example: StpImageType
        label:
          type: string
          example: Image Type
        group:
          type: string
        ui:
          type: string
          enum: [PickOne, PickMany, Boolean]
        hint:
          type:
          - string
          - 'null'
          description: Driver UI hint such as checkbox or dropdown.
        default:
          type:
          - string
          - 'null'
        choices:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string

    LayoutPlan:
      description: >
        How the selected pages land on sheets, following CUPS number-up,
        print-scaling, and orientation rules. A sheet may be shown turned so its
        pages read upright, as print dialogs do. Draw each cell's page image
        rotated by rotate degrees inside the cell. An approximation: the driver
        can still shift content by its hardware margins.
      type: object
      properties:
        paper:
          type: object
          properties:
            keyword:
              type: string
            label:
              type: string
            width_pt:
              type: number
            height_pt:
              type: number
        pages_per_sheet:
          type: integer
        pages_per_sheet_layout:
          type:
          - string
          - 'null'
        page_border:
          type:
          - string
          - 'null'
        scaling:
          type: string
          enum: [auto, auto-fit, fit, fill, none, custom]
        scale_percent:
          type:
          - integer
          - 'null'
        selected_page_count:
          type: integer
        impressions_per_copy:
          type: integer
          description: Printed sides per copy.
        sheets_per_copy:
          type: integer
        copies:
          type: integer
        total_sheets:
          type: integer
        reverse_order:
          type: boolean
          description: Sheets come out last to first. sides stay in reading order.
        sides:
          type: array
          items:
            $ref: '#/components/schemas/LayoutSide'

    LayoutSide:
      type: object
      properties:
        sheet:
          type: integer
        face:
          type: string
          enum: [front, back]
        width_pt:
          type: number
        height_pt:
          type: number
        printable:
          $ref: '#/components/schemas/LayoutBox'
        cells:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/LayoutBox'
            - type: object
              properties:
                page:
                  type: integer
                rotate:
                  type: integer
                  enum: [0, 90]

    LayoutBox:
      description: Fractions of the sheet from its top-left corner. Values beyond 0..1 are cropped.
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
