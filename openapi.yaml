openapi: 3.1.0
info:
  title: Local Printer API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /auth/signup:
    post:
      summary: Signup
      operationId: signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Signup Auth Signup Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Login Auth Login Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      summary: Logout
      operationId: logout_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
                title: Response Logout Auth Logout Post
  /auth/me:
    get:
      summary: Me
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Auth Me Get
  /status:
    get:
      summary: Status
      operationId: status_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Status Status Get
  /print:
    post:
      summary: Print File
      operationId: print_file_print_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Print File Print Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs:
    get:
      summary: List Jobs
      operationId: list_jobs_jobs_get
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          description: 'Job scope: active, completed, or all'
          default: active
          title: Scope
        description: 'Job scope: active, completed, or all'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Jobs Jobs Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /options:
    get:
      summary: Get Options
      operationId: get_options_options_get
      parameters:
      - name: debug
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Debug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Options Options Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      summary: Get Job
      operationId: get_job_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Job Jobs  Job Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Cancel Job
      operationId: cancel_job_jobs__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Cancel Job Jobs  Job Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}/forget:
    post:
      summary: Forget Job
      operationId: forget_job_jobs__job_id__forget_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Forget Job Jobs  Job Id  Forget Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files:
    post:
      summary: Upload File
      operationId: upload_file_files_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_files_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Upload File Files Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files/{file_id}/preview:
    get:
      summary: List Previews
      operationId: list_previews_files__file_id__preview_get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Previews Files  File Id  Preview Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /files/{file_id}/preview/{page}:
    get:
      summary: Get Preview Page
      operationId: get_preview_page_files__file_id__preview__page__get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: page
        in: path
        required: true
        schema:
          type: string
          title: Page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /me/preferences:
    get:
      summary: Get Preferences
      operationId: get_preferences_me_preferences_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Get Preferences Me Preferences Get
    put:
      summary: Put Preferences
      operationId: put_preferences_me_preferences_put
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Preferences
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Put Preferences Me Preferences Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /history:
    get:
      summary: List History
      operationId: list_history_history_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List History History Get
  /history/{history_id}:
    get:
      summary: Get History Entry
      operationId: get_history_entry_history__history_id__get
      parameters:
      - name: history_id
        in: path
        required: true
        schema:
          type: integer
          title: History Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get History Entry History  History Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_upload_file_files_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_file_files_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    PrintOptions:
      properties:
        copies:
          type: integer
          maximum: 99.0
          minimum: 1.0
          title: Copies
          default: 1
        pages:
          anyOf:
          - type: string
          - type: 'null'
          title: Pages
        paper_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Paper Size
        orientation:
          anyOf:
          - type: string
            enum:
            - portrait
            - landscape
            - reverse-landscape
            - reverse-portrait
          - type: 'null'
          title: Orientation
        color_mode:
          anyOf:
          - type: string
            enum:
            - monochrome
            - color
            - auto
          - type: 'null'
          title: Color Mode
        duplex:
          anyOf:
          - type: string
            enum:
            - none
            - long-edge
            - short-edge
          - type: 'null'
          title: Duplex
        quality:
          anyOf:
          - type: string
            enum:
            - draft
            - normal
            - high
          - type: 'null'
          title: Quality
        collate:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Collate
        media_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Media Type
        fit_to_page:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Fit To Page
      additionalProperties: true
      type: object
      title: PrintOptions
    PrintRequest:
      properties:
        file_id:
          type: string
          title: File Id
        options:
          $ref: '#/components/schemas/PrintOptions'
      type: object
      required:
      - file_id
      title: PrintRequest
    SignupRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
      type: object
      required:
      - username
      - password
      title: SignupRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
